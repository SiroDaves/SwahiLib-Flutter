name: swahilib
description: Kiswahili Kitukuzwe - Kamusi ya Kiswahili ya maneno, nahau, methali na misemo
publish_to: 'none'

version: 1.0.125

environment:
  sdk: ^3.5.4

dependencies:
  connectivity_plus: ^6.1.3    # Check network connectivity status (WiFi/Mobile/Offline)
  cupertino_icons: ^1.0.8    # iOS-style icons for use with the Cupertino widgets
  dartx: ^1.2.0    # Kotlin-like extension methods for Dart collections and primitives
  floor: ^1.5.0    # SQLite abstraction for Flutter with DAO pattern
  flutter:
    sdk: flutter    # Core Flutter SDK
  flutter_bloc: ^8.1.6    # State management library based on BLoC (Business Logic Component) pattern
  flutter_html: ^3.0.0-beta.2    # Render HTML content as Flutter widgets
  freezed_annotation: ^2.4.4     # Annotations for generating immutable classes with union/pattern matching
  get_it: ^8.0.2    # Simple service locator for dependency injection
  http: ^1.3.0     # HTTP client for making web requests
  injectable: ^2.5.0    # Dependency injection framework for Flutter using annotations
  intl: ^0.19.0    # Internationalization and localization support
  json_annotation: ^4.9.0    # Annotations for code generation to serialize/deserialize JSON
  loading_indicator: ^3.1.1    # Various loading animations for async operations
  package_info_plus: ^8.1.1    # Access app version, package name, and build number
  path: ^1.9.0     # Path manipulation utilities (for files, directories, etc.)
  path_provider: ^2.1.5     # Access commonly used locations on the filesystem
  percent_indicator: ^4.2.4    # Circular and linear percent indicators
  rxdart: ^0.28.0    # Reactive functional programming with observables and streams
  sentry_flutter: ^8.5.0    # Error tracking and performance monitoring using Sentry
  share_plus: ^10.1.2    # Share content from your Flutter app with other apps
  shared_preferences: ^2.3.3     # Persistent storage for simple key-value pairs
  sizer: ^3.0.4    # Helps with responsive UI using screen dimensions
  skeleton_loader: ^2.0.0+4    # Display shimmer loading placeholders for content
  sqflite: ^2.4.1    # SQLite plugin for Flutter
  styled_widget: ^0.4.1     # Simplifies Flutter widget styling through extension methods
  supabase_flutter: ^2.8.3    # Supabase client for Flutter, provides auth, storage, database access
  textstyle_extensions: ^2.0.0-nullsafety # Utility extensions for `TextStyle` manipulation
  url_launcher: ^6.3.1    # Launch URLs (email, phone, web) in a mobile browser or other apps

dev_dependencies:
  build_runner: ^2.4.13     # Code generation tool (used with freezed, json_serializable, etc.)
  floor_generator: ^1.5.0    # Generates the database access code for Floor
  flutter_lints: ^4.0.0     # Recommended lint rules for Flutter apps
  flutter_test:
    sdk: flutter    # Flutter's built-in testing framework
  freezed: ^2.5.7    # Code generator for creating immutable classes with union types
  injectable_generator: ^2.6.2    # Code generator for injectable DI setup
  json_serializable: ^6.8.0    # Code generator for serializing classes to/from JSON


flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/sound/
  fonts:
    - family: TrebuchetMS
  fonts:
    - asset: assets/fonts/Trebuchet-MS.ttf
